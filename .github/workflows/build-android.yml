name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Sync Capacitor
      run: npx cap sync android
      
    - name: Build debug APK
      run: |
        cd android
        ./gradlew assembleDebug
        
    - name: Build release APK (if keystore available)
      if: ${{ secrets.KEYSTORE_FILE_BASE64 != '' }}
      run: |
        echo "${{ secrets.KEYSTORE_FILE_BASE64 }}" | base64 -d > android/app/release.keystore
        cd android
        ./gradlew assembleRelease
        
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: ecoverify-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Upload release APK
      if: ${{ secrets.KEYSTORE_FILE_BASE64 != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ecoverify-release
        path: android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        
    - name: Create GitHub Release
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: EcoVerify Android APK v${{ github.run_number }}
        body: |
          ## EcoVerify Android APK
          
          ### Debug APK
          📱 [Download Debug APK](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          ### Installation
          1. Download the APK file
          2. Enable "Install from unknown sources" on your Android device
          3. Open the APK file to install
          
          ### Notes
          - Debug APK is for testing purposes
          - Release APK (if available) is signed and ready for distribution
        files: |
          android/app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}