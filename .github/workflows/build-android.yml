name: Build Android APK

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

# O workflow só precisa ler o repositório e publicar o artifact da execução.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ==========================================
      # 3. Instalar dependências
      # ==========================================
      - name: Install dependencies
        run: npm ci

      # ==========================================
      # 4. Java
      # ==========================================
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # Valida o Gradle Wrapper e reutiliza o cache das dependências Android.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # ==========================================
      # 5. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # ==========================================
      # 6. Permissão do Gradle
      # ==========================================
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ==========================================
      # 7. Sincronizar Capacitor
      # ==========================================
      - name: Validate Capacitor server URL
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || secrets.CAPACITOR_SERVER_URL }}
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "CAPACITOR_SERVER_URL must be configured as a repository variable or secret."
            exit 1
          fi

          case "$CAPACITOR_SERVER_URL" in
            https://*) ;;
            *)
              echo "CAPACITOR_SERVER_URL must use HTTPS."
              exit 1
              ;;
          esac

      - name: Sync Capacitor
        run: npm exec cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL || secrets.CAPACITOR_SERVER_URL }}

      # ==========================================
      # 8. Build do APK Debug
      # ==========================================
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
        working-directory: android

      # ==========================================
      # 9. Upload do APK como Artifact
      # ==========================================
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ecoverify-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
